settings:
  # Telegram is silent unless a clean High-confidence Buy or Sell setup exists.
  send_hourly_summary: false
  send_only_when_actionable: true
  send_candidate_refresh_telegram: false
  # Real-money safety mode: Telegram only sends High-confidence stock setups.
  min_setup_confidence: High
  # Short is disabled by policy. Bearish actionable setups use Sell as a research/risk label.
  allow_short_model_view: false
  duplicate_silence_hours: 24
  max_alerts_per_run: 3
  min_successful_scans: 1

  # Short-term setups use hourly timing; one year of daily data provides medium-term context.
  # Short-term: 1 week to 3 months. Medium-term: more than 3 months to 1 year.
  timeframe_label: "Short-term focus: 1 week to 3 months; medium-term context: more than 3 months to 1 year"

  # Hourly timing chart + daily context chart.
  hourly_period: 30d
  hourly_interval: 1h
  daily_period: 1y
  daily_interval: 1d

  # 3-day discovery job.
  discovery_period: 6mo
  discovery_interval: 1d
  # Wider scan for a bigger research circle while keeping Telegram capped and deduped.
  max_scan_symbols_per_run: 90
  top_candidate_count: 12

  # Technical setup rules. The scanner is intentionally strict and favors fewer, higher-quality alerts.
  breakout_lookback_bars: 20
  risk_reward_multiple: 2.5
  atr_multiple_stop: 1.4
  breakout_buffer_atr: 0.10
  near_trigger_atr_fraction: 0.30
  min_volume_ratio_high: 1.20
  # Medium-confidence setups may be stored, but Telegram requires High confidence.
  min_volume_ratio_medium: 1.00
  min_risk_reward: 2.2
  # Hard cap for actionable stock alerts. Code also clamps this below 15% as a safety backstop.
  max_risk_pct: 6.0

  # Entry setup RSI window.
  entry_rsi_min: 52
  entry_rsi_high_min: 58
  entry_rsi_max: 68

  # Exit/risk setup RSI window.
  exit_rsi_max: 44
  exit_rsi_high_max: 38


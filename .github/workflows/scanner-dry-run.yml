name: Scanner Dry Run

run-name: "Scanner dry run - ${{ github.event_name }} - run #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: scanner-dry-run
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LOG_LEVEL: INFO
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

jobs:
  dry-run:
    name: Run scanners without Telegram delivery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-stocks.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install             --requirement requirements.txt             --requirement requirements-stocks.txt             --prefer-binary             --retries 5             --timeout 45
          python -m pip check

      - name: Run public scanner without delivery
        env:
          RUN_ONCE: "true"
          SQLITE_PATH: data/dry-run-public.sqlite3
        run: |
          mkdir -p artifacts data
          set +e
          python main.py 2>&1 | tee artifacts/public-scanner.log
          status=${PIPESTATUS[0]}
          set -e
          printf 'public_scanner_exit_code=%s\n' "${status}" | tee -a artifacts/summary.txt
          echo "PUBLIC_SCANNER_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          echo "Public scanner completed with exit code ${status}; no Telegram secrets were provided."

      - name: Run stock scanners without delivery
        env:
          STOCK_SQLITE_PATH: data/dry-run-stocks.sqlite3
        run: |
          set +e
          python -m stocks.scanner --mode hourly 2>&1 | tee artifacts/stock-hourly.log
          hourly_status=${PIPESTATUS[0]}
          python -m stocks.scanner --mode discover 2>&1 | tee artifacts/stock-discover.log
          discover_status=${PIPESTATUS[0]}
          set -e
          printf 'stock_hourly_exit_code=%s\nstock_discover_exit_code=%s\n' "${hourly_status}" "${discover_status}" | tee -a artifacts/summary.txt
          echo "Stock scanners completed; no Telegram secrets were provided."
          if [[ "${PUBLIC_SCANNER_EXIT_CODE}" -ne 0 || "${hourly_status}" -ne 0 || "${discover_status}" -ne 0 ]]; then
            echo "One or more scanners failed; uploaded logs contain details."
            exit 1
          fi

      - name: Upload dry-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-dry-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
